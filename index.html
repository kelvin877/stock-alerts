<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>股價通知</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #0f1720; --muted: #667085; --line: #e4e7ec;
    --up: #0a8f5a; --down: #d92d20; --accent: #2457f5; --warn: #b54708; --soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --card: #141a22; --ink: #e8edf3; --muted: #8b97a8; --line: #232c38;
      --up: #3ccb8c; --down: #ff6b5e; --accent: #7c9cff; --warn: #f5a524; --soft: #1b2333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  button, input, select { font: inherit; color: inherit; }
  .icon-btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); outline: none; min-height: 44px;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; min-height: 44px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .primary:disabled { opacity: .5; cursor: default; }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; min-height: 34px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .warn { color: var(--warn); font-size: 13px; }
  .err { color: var(--down); font-size: 13px; }
  .pos { color: var(--up); } .neg { color: var(--down); }

  .addbar { display: flex; gap: 8px; }
  .addbar input { text-transform: uppercase; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin: 4px 2px 10px; }
  .toolbar select { width: auto; min-height: 32px; padding: 4px 8px; font-size: 13px; }

  .stock-head { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
  .logo { width: 44px; height: 44px; border-radius: 12px; object-fit: contain; background: #fff; border: 1px solid var(--line); padding: 4px; }
  .logo.letter { display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff; padding: 0; border: 0; }
  .sym { font-weight: 700; font-size: 17px; }
  .name { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .price { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 19px; }
  .cur { font-size: 12px; color: var(--muted); font-weight: 400; }
  .chg { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--soft); color: var(--muted); margin-left: 4px; vertical-align: 2px; }
  .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 10px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }

  .alerts { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .alert-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .alert-row .target { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
  .alert-row .note { color: var(--muted); font-size: 12px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
  .pill.fired { background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); }
  .row-actions { display: flex; gap: 6px; align-items: center; }
  .card-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }

  .alert-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--bg); }
  .alert-form .full { grid-column: 1 / -1; }
  .alert-form .btns { display: flex; gap: 8px; justify-content: flex-end; }

  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); width: min(520px, 92vw); padding: 20px; }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog .grid { display: grid; gap: 12px; }
  dialog h2 { margin: 0 0 4px; font-size: 18px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .dlg-actions button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
  .dlg-actions .primary { border: 0; background: var(--accent); }
  .banner { background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
  .banner button { margin-top: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; }

  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 12px; position: sticky; top: env(safe-area-inset-top); z-index: 5; }
  .tabs a { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; }
  .tabs a.on { background: var(--accent); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  .seg button.on.up { background: var(--up); color: #fff; }
  .seg button.on.down { background: var(--down); color: #fff; }
  .rank-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .rank-head h2 { font-size: 18px; margin: 0; }
  .rank-list { padding: 4px 0; }
  .rank-row { display: grid; grid-template-columns: 26px 36px 1fr auto 36px; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .rank-row:last-child { border-bottom: 0; }
  .rank-row .n { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .rank-row .logo, .rank-row .logo.letter { width: 36px; height: 36px; border-radius: 10px; font-size: 15px; }
  .rank-row .sym { font-size: 15px; }
  .rank-row .r { text-align: right; font-variant-numeric: tabular-nums; }
  .rank-row .big { font-weight: 650; font-size: 15px; }
  .add-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--accent); }
  .watch-controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
  .seg button.on.plain { background: var(--accent); color: #fff; }
  .rank-row.watch { grid-template-columns: 26px 36px 1fr auto; }
  .add-btn.done { color: var(--up); border-color: transparent; cursor: default; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>我的股票</h1>
      <div class="sub">觀察清單 · 到價推送去 ntfy</div>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="設定">⚙︎ 設定</button>
  </header>

  <nav class="tabs">
    <a href="#watch" data-view="watch">我的股票</a>
    <a href="#movers" data-view="movers">升跌排行</a>
    <a href="#popular" data-view="popular">熱門 100</a>
  </nav>

  <div id="setupBanner" class="banner" hidden>
    第一次用要先喺「設定」入面填 GitHub token，先可以加股票同設通知。
    <div><button class="primary" id="bannerSettings">開設定</button></div>
  </div>

  <div id="view-watch">
  <section class="card">
    <form id="addStock" autocomplete="off">
      <label for="symbol">加股票入觀察清單</label>
      <div class="addbar">
        <input id="symbol" placeholder="例如 AAPL、SHOP.TO" required autocapitalize="characters" spellcheck="false">
        <button class="primary" id="addBtn" type="submit">加入</button>
      </div>
      <div class="hint">美股直接打代號；加股要加 <b>.TO</b>（多倫多）或者 <b>.V</b>（創業板），例如 RY.TO</div>
      <div id="addMsg"></div>
    </form>
  </section>

  <div class="toolbar">
    <span><span id="updated">載入中…</span> · <span id="market"></span></span>
  </div>
  <div class="watch-controls">
    <div class="seg" id="watchMode">
      <button type="button" data-wmode="list">清單</button>
      <button type="button" data-wmode="gainers">▲ 升幅排名</button>
      <button type="button" data-wmode="losers">▼ 跌幅排名</button>
    </div>
    <div class="seg" id="watchPeriod">
      <button type="button" data-period="day">今日</button>
      <button type="button" data-period="week">本週</button>
      <button type="button" data-period="month">本月</button>
    </div>
  </div>
  <div id="list"></div>
  </div>

  <div id="view-movers" hidden>
    <div class="rank-head">
      <div>
        <h2 id="moversTitle">本月升幅 Top 20</h2>
        <div class="sub" id="moversSub"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="seg" id="moversPeriod">
          <button type="button" data-mp="week">本週</button>
          <button type="button" data-mp="month" class="on plain">本月</button>
        </div>
        <div class="seg" id="moversMode">
          <button type="button" data-mode="gainers" class="on up">▲ 升幅</button>
          <button type="button" data-mode="losers">▼ 跌幅</button>
        </div>
      </div>
    </div>
    <div class="card rank-list" id="moversList"></div>
  </div>

  <div id="view-popular" hidden>
    <div class="rank-head">
      <div>
        <h2>熱門 100</h2>
        <div class="sub" id="popularSub">按過去 20 個交易日平均成交額排名</div>
      </div>
    </div>
    <div class="card rank-list" id="popularList"></div>
  </div>
</main>

<dialog id="settings">
  <form method="dialog" class="grid">
    <h2>設定</h2>
    <div>
      <label for="owner">GitHub 用戶名</label>
      <input id="owner" spellcheck="false" autocapitalize="none" required>
    </div>
    <div>
      <label for="repo">Repo 名</label>
      <input id="repo" spellcheck="false" autocapitalize="none" required>
    </div>
    <div>
      <label for="token">GitHub token</label>
      <input id="token" type="password" spellcheck="false" autocapitalize="none" placeholder="github_pat_…">
      <div class="hint">用 fine-grained token，只揀呢個 repo，權限：Contents → Read and write。token 只會儲喺呢部機嘅瀏覽器入面。</div>
    </div>
    <div class="dlg-actions">
      <button type="button" id="forget">清除 token</button>
      <button value="cancel" formnovalidate>取消</button>
      <button value="save" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  function guessRepo() {
    const h = location.hostname;
    if (!h.endsWith(".github.io")) return {};
    const owner = h.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return { owner, repo: seg || `${owner}.github.io` };
  }
  const guess = guessRepo();
  const cfg = {
    owner: store.get("sa.owner") || guess.owner || "",
    repo: store.get("sa.repo") || guess.repo || "",
    token: store.get("sa.token") || "",
    branch: "main",
  };

  let data = { watchlist: [], alerts: [] }, state = {}, prices = {}, updated = null, rankings = null;
  let moversMode = "gainers";
  let moversPeriod = store.get("sa.mperiod") === "week" ? "week" : "month";
  const PERIOD = { day: "今日", week: "本週", month: "本月" };
  let openFormFor = null;
  let watchMode = store.get("sa.wmode") || "list";
  let watchPeriod = store.get("sa.wperiod") || "day";
  if (!["list", "gainers", "losers"].includes(watchMode)) watchMode = "list";
  if (!["day", "week", "month"].includes(watchPeriod)) watchPeriod = "day";

  // ---------- helpers ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (v) => v == null || isNaN(v) ? "—" :
    Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: Math.abs(v) < 1 ? 4 : 2 });
  const signed = (v, d = 2) => (v >= 0 ? "+" : "") + v.toFixed(d);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const timeAgo = (iso) => {
    if (!iso) return "未有數據";
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return "啱啱";
    if (s < 3600) return `${Math.floor(s / 60)} 分鐘前`;
    if (s < 86400) return `${Math.floor(s / 3600)} 個鐘前`;
    return new Date(iso).toLocaleString("zh-HK", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  };
  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }
  function b64decode(s) {
    const bin = atob(s.replace(/\n/g, ""));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  }
  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = ""; bytes.forEach((b) => (bin += String.fromCharCode(b)));
    return btoa(bin);
  }
  function marketStatus() {
    const et = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
    const d = et.getDay(), m = et.getHours() * 60 + et.getMinutes();
    if (d === 0 || d === 6) return "週末休市";
    if (m >= 570 && m < 960) return "🟢 開市中";
    if (m >= 240 && m < 570) return "🟡 盤前";
    if (m >= 960 && m < 1200) return "🟡 盤後";
    return "⚪ 休市";
  }

  // ---------- logos ----------
  function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
  function logoHtml(sym) {
    const base = sym.split(".")[0];
    return `<img class="logo" alt="" loading="lazy"
      src="https://financialmodelingprep.com/image-stock/${encodeURIComponent(sym)}.png"
      data-alt="https://assets.parqet.com/logos/symbol/${encodeURIComponent(base)}?format=png"
      data-sym="${esc(sym)}">`;
  }
  document.addEventListener("error", (ev) => {
    const img = ev.target;
    if (!(img instanceof HTMLImageElement) || !img.classList.contains("logo")) return;
    if (img.dataset.alt) { const alt = img.dataset.alt; delete img.dataset.alt; img.src = alt; return; }
    const d = document.createElement("div");
    const sym = img.dataset.sym || "?";
    d.className = "logo letter";
    d.style.background = `hsl(${hue(sym)} 55% 45%)`;
    d.textContent = sym[0];
    img.replaceWith(d);
  }, true);

  // ---------- GitHub ----------
  async function gh(path, opts = {}) {
    const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${path}`, {
      ...opts, cache: "no-store",
      headers: {
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(cfg.token ? { Authorization: `Bearer ${cfg.token}` } : {}),
        ...(opts.headers || {}),
      },
    });
    if (!r.ok) {
      const e = new Error(`GitHub ${r.status}`);
      e.status = r.status;
      try { e.detail = (await r.json()).message; } catch {}
      throw e;
    }
    return r.json();
  }
  async function readJson(name, fallback) {
    try {
      if (cfg.token) {
        const j = await gh(`contents/${name}?ref=${cfg.branch}`);
        return { data: JSON.parse(b64decode(j.content)), sha: j.sha };
      }
      const r = await fetch(`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${name}`, { cache: "no-store" });
      if (r.status === 404) return { data: fallback, sha: null };
      if (!r.ok) throw Object.assign(new Error(`讀取 ${name} 失敗 (${r.status})`), { status: r.status });
      return { data: await r.json(), sha: null };
    } catch (e) {
      if (e.status === 404) return { data: fallback, sha: null };
      throw e;
    }
  }
  function normalize(d) {
    const alerts = Array.isArray(d && d.alerts) ? d.alerts : [];
    const watchlist = Array.isArray(d && d.watchlist) ? d.watchlist.map((s) => String(s).toUpperCase()) : [];
    for (const a of alerts) { const s = a.symbol.toUpperCase(); if (!watchlist.includes(s)) watchlist.push(s); }
    return { watchlist, alerts };
  }
  async function updateData(mutate, message) {
    if (!cfg.token) { openSettings(); throw new Error("請先喺設定填 GitHub token"); }
    for (let i = 0; i < 3; i++) {
      const { data: raw, sha } = await readJson("alerts.json", { alerts: [] });
      const next = mutate(normalize(raw));
      const body = {
        message, branch: cfg.branch,
        content: b64encode(JSON.stringify(next, null, 2) + "\n"),
        ...(sha ? { sha } : {}),
      };
      try {
        await gh("contents/alerts.json", { method: "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } });
        data = next;
        render(true);
        return;
      } catch (e) {
        if ((e.status === 409 || e.status === 422) && i < 2) continue;
        throw e;
      }
    }
  }
  async function refresh() {
    if (!cfg.owner || !cfg.repo) { $("updated").textContent = "未設定 repo"; openSettings(); return; }
    try {
      const [a, s, p, rk] = await Promise.all([
        readJson("alerts.json", { alerts: [] }),
        readJson("state.json", {}),
        readJson("prices.json", { prices: {} }),
        readJson("rankings.json", null).catch(() => ({ data: null })),
      ]);
      rankings = rk.data;
      data = normalize(a.data);
      state = s.data || {};
      prices = (p.data && p.data.prices) || {};
      updated = p.data && p.data.updated;
      render();
      renderRankings();
    } catch (e) {
      $("updated").textContent = e.status === 401 ? "token 無效或者過咗期，請喺設定更新" :
        e.status === 403 ? "GitHub 拒絕存取（token 權限唔夠或者用量超咗）" : `載入失敗：${e.detail || e.message}`;
    }
  }

  // ---------- render ----------
  function quote(sym) { return prices[sym] || {}; }
  function changePct(q) { return q.price != null && q.prev_close ? ((q.price - q.prev_close) / q.prev_close) * 100 : null; }

  function alertRow(a, q) {
    const up = a.condition === "above";
    const fired = state[a.id];
    let pill;
    if (fired) pill = `<span class="pill fired">✓ ${timeAgo(fired.triggered_at)}觸發 @ ${fmt(fired.price)}</span>`;
    else if (q.price != null) {
      const dist = ((a.price - q.price) / q.price) * 100;
      pill = `<span class="pill">相差 ${signed(dist)}%</span>`;
    } else pill = `<span class="pill">等緊更新</span>`;
    return `
      <div class="alert-row">
        <div>
          <div class="target ${up ? "pos" : "neg"}">${up ? "▲ 升到 ≥" : "▼ 跌到 ≤"} ${fmt(a.price)}</div>
          ${a.note ? `<div class="note">${esc(a.note)}</div>` : ""}
        </div>
        <div class="row-actions">
          ${pill}
          ${fired ? `<button class="ghost" data-act="rearm" data-id="${esc(a.id)}">重新開</button>` : ""}
          <button class="ghost" data-act="delAlert" data-id="${esc(a.id)}" aria-label="刪除通知">✕</button>
        </div>
      </div>`;
  }

  function alertForm(sym) {
    return `
      <form class="alert-form" data-sym="${esc(sym)}" autocomplete="off">
        <div>
          <label>條件</label>
          <select name="condition">
            <option value="above">升到或以上 ≥</option>
            <option value="below">跌到或以下 ≤</option>
          </select>
        </div>
        <div>
          <label>目標價</label>
          <input name="price" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00" required>
        </div>
        <div class="full">
          <input name="note" maxlength="80" placeholder="備註（可以留空）">
        </div>
        <div class="full msg"></div>
        <div class="full btns">
          <button type="button" class="ghost" data-act="cancelForm">取消</button>
          <button type="submit" class="primary">儲存通知</button>
        </div>
      </form>`;
  }

  function stockCard(sym) {
    const q = quote(sym);
    const pct = changePct(q);
    const abs = q.price != null && q.prev_close ? q.price - q.prev_close : null;
    const ext = q.price != null && q.regular != null && Math.abs(q.price - q.regular) > 1e-9;
    const alerts = data.alerts.filter((a) => a.symbol.toUpperCase() === sym);
    let priceBlock;
    if (q.price != null) {
      priceBlock = `
        <div class="price">${fmt(q.price)} <span class="cur">${esc(q.currency || "")}</span></div>
        <div class="chg ${pct == null ? "" : pct >= 0 ? "pos" : "neg"}">
          ${pct == null ? "" : `${signed(abs)} (${signed(pct)}%)`}${ext ? `<span class="tag">盤前/後</span>` : ""}
        </div>`;
    } else if (q.error) {
      priceBlock = `<div class="err" style="text-align:right">⚠︎ ${esc(q.error)}</div>`;
    } else {
      priceBlock = `<div class="sub" style="text-align:right">等緊攞價…</div>`;
    }
    const meta = [];
    if (ext && q.regular != null) meta.push(`收市 ${fmt(q.regular)}`);
    if (q.day_low != null && q.day_high != null) meta.push(`今日 ${fmt(q.day_low)} – ${fmt(q.day_high)}`);
    const wp = weekPct(sym);
    if (wp != null) meta.push(`本週 <span class="${wp >= 0 ? "pos" : "neg"}">${signed(wp)}%</span>`);
    const mp = monthPct(sym);
    if (mp != null) meta.push(`本月 <span class="${mp >= 0 ? "pos" : "neg"}">${signed(mp)}%</span>`);
    if (q.exchange) meta.push(esc(q.exchange));
    return `
      <div class="card" data-card="${esc(sym)}">
        <div class="stock-head">
          ${logoHtml(sym)}
          <div style="min-width:0">
            <div class="sym">${esc(sym)}</div>
            <div class="name">${esc(q.name || "")}</div>
          </div>
          <div>${priceBlock}</div>
        </div>
        ${meta.length ? `<div class="meta">${meta.map((m) => `<span>${m}</span>`).join("")}</div>` : ""}
        ${alerts.length ? `<div class="alerts">${alerts.map((a) => alertRow(a, q)).join("")}</div>` : ""}
        ${openFormFor === sym ? alertForm(sym) : `
          <div class="card-actions">
            <button class="ghost" data-act="removeStock" data-sym="${esc(sym)}">移除</button>
            <button class="ghost" data-act="openForm" data-sym="${esc(sym)}">🔔 設通知</button>
          </div>`}
      </div>`;
  }

  function monthPct(sym) {
    const m = rankings && rankings.month_pct;
    return m && m[sym] != null ? m[sym] : null;
  }
  function weekPct(sym) {
    const m = rankings && rankings.week_pct;
    return m && m[sym] != null ? m[sym] : null;
  }
  function periodPct(sym) {
    return watchPeriod === "month" ? monthPct(sym) : watchPeriod === "week" ? weekPct(sym) : changePct(quote(sym));
  }

  function renderWatchControls() {
    document.querySelectorAll("#watchMode button").forEach((b) => {
      const on = b.dataset.wmode === watchMode;
      b.classList.toggle("on", on);
      b.classList.toggle("up", on && watchMode === "gainers");
      b.classList.toggle("down", on && watchMode === "losers");
      b.classList.toggle("plain", on && watchMode === "list");
    });
    $("watchPeriod").hidden = watchMode === "list";
    document.querySelectorAll("#watchPeriod button").forEach((b) => {
      const on = b.dataset.period === watchPeriod;
      b.classList.toggle("on", on);
      b.classList.toggle("plain", on);
    });
  }

  function renderWatchRanking() {
    const up = watchMode === "gainers";
    const withPct = data.watchlist.map((s) => ({ s, p: periodPct(s) }));
    const known = withPct.filter((x) => x.p != null).sort((a, b) => up ? b.p - a.p : a.p - b.p);
    const unknown = withPct.filter((x) => x.p == null);
    const rows = known.map((x, i) => {
      const q = quote(x.s);
      return `
        <div class="rank-row watch">
          <div class="n">${i + 1}</div>
          ${logoHtml(x.s)}
          <div style="min-width:0">
            <div class="sym">${esc(x.s)}</div>
            <div class="name">${esc(q.name || "")}</div>
          </div>
          <div class="r">
            <span class="big ${x.p >= 0 ? "pos" : "neg"}">${signed(x.p)}%</span>
            <div class="sub">${fmt(q.price)}</div>
          </div>
        </div>`;
    }).join("");
    const note = unknown.length
      ? `<div class="hint" style="padding:10px 14px">未有${PERIOD[watchPeriod]}數據：${unknown.map((x) => esc(x.s)).join("、")}${watchPeriod !== "day" ? "（排行每個鐘更新一次）" : ""}</div>`
      : "";
    const label = `${PERIOD[watchPeriod]}${up ? "升幅" : "跌幅"}排名`;
    return `<div class="sub" style="margin:0 2px 8px">${label} · 共 ${known.length} 隻</div>
      <div class="card rank-list">${rows || `<div class="empty">未有數據</div>`}${note}</div>`;
  }

  function render(force = false) {
    $("setupBanner").hidden = !!cfg.token;
    $("updated").textContent = `價格更新：${timeAgo(updated)}`;
    $("market").textContent = marketStatus();
    if (openFormFor && !force) return; // don't wipe a half-filled form
    const list = $("list");
    if (!data.watchlist.length) {
      list.innerHTML = `<div class="card empty">觀察清單未有股票。喺上面加第一隻啦。</div>`;
      return;
    }
    renderWatchControls();
    if (watchMode !== "list") { list.innerHTML = renderWatchRanking(); return; }
    list.innerHTML = data.watchlist.map(stockCard).join("");
    if (openFormFor) {
      const f = list.querySelector(`form.alert-form`);
      if (f) f.price.focus();
    }
  }

  // ---------- rankings ----------
  const compact = (v) => v == null ? "—" : v >= 1e9 ? `$${(v / 1e9).toFixed(1)}B` : v >= 1e6 ? `$${(v / 1e6).toFixed(0)}M` : `$${Math.round(v).toLocaleString()}`;
  function addBtn(sym) {
    return data.watchlist.includes(sym)
      ? `<button class="add-btn done" disabled aria-label="已喺觀察清單">✓</button>`
      : `<button class="add-btn" data-watch="${esc(sym)}" aria-label="加入觀察清單">＋</button>`;
  }
  function rankRow(r, i, right) {
    return `
      <div class="rank-row">
        <div class="n">${i + 1}</div>
        ${logoHtml(r.symbol)}
        <div style="min-width:0">
          <div class="sym">${esc(r.symbol)}</div>
          <div class="name">${esc(r.name || "")}</div>
        </div>
        <div class="r">${right}</div>
        ${addBtn(r.symbol)}
      </div>`;
  }
  function pctSpan(v, big) {
    if (v == null) return "—";
    return `<span class="${v >= 0 ? "pos" : "neg"}${big ? " big" : ""}">${signed(v)}%</span>`;
  }
  function renderRankings() {
    const empty = `<div class="empty">排行榜未有數據。GitHub 每個鐘（開市時間）會更新一次，第一次大約要等幾分鐘。</div>`;
    const ml = $("moversList"), pl = $("popularList");
    if (!rankings) { ml.innerHTML = empty; pl.innerHTML = empty; return; }
    const [y, m] = (rankings.month || "").split("-");
    const up = moversMode === "gainers";
    const wk = moversPeriod === "week" && rankings.week_gainers;
    const periodLabel = wk ? "本週" : (m ? Number(m) + " 月" : "本月");
    $("moversTitle").textContent = `${periodLabel}${up ? "升幅" : "跌幅"} Top 20`;
    $("moversSub").textContent = `由${wk ? "上週五" : "上月最後一日"}收市計起 · ${rankings.universe_size || ""} 隻美股入面揀 · 更新：${timeAgo(rankings.updated)}`;
    document.querySelectorAll("#moversPeriod button").forEach((b) => {
      const on = b.dataset.mp === (wk ? "week" : "month");
      b.classList.toggle("on", on); b.classList.toggle("plain", on);
    });
    document.querySelectorAll("#moversMode button").forEach((b) => {
      const on = b.dataset.mode === moversMode;
      b.classList.toggle("on", on);
      b.classList.toggle("up", on && b.dataset.mode === "gainers");
      b.classList.toggle("down", on && b.dataset.mode === "losers");
    });
    const rows = rankings[(wk ? "week_" : "") + moversMode] || [];
    ml.innerHTML = rows.length ? rows.map((r, i) => rankRow(r, i, `
        ${pctSpan(wk ? r.week_pct : r.month_pct, true)}
        <div class="sub">${fmt(r.price)}</div>`)).join("") : empty;
    const pop = rankings.popular || [];
    $("popularSub").textContent = `按過去 20 個交易日平均每日成交額排名 · 更新：${timeAgo(rankings.updated)}`;
    pl.innerHTML = pop.length ? pop.map((r, i) => rankRow(r, i, `
        <div class="big">${fmt(r.price)}</div>
        <div class="sub">${pctSpan(r.day_pct)} · ${compact(r.dollar_volume)}</div>`)).join("") : empty;
  }
  $("moversPeriod").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-mp]");
    if (!b) return;
    moversPeriod = b.dataset.mp; store.set("sa.mperiod", moversPeriod);
    renderRankings();
  });
  $("moversMode").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-mode]");
    if (!b) return;
    moversMode = b.dataset.mode;
    renderRankings();
  });
  async function watchFromList(btn) {
    const sym = btn.dataset.watch;
    btn.disabled = true;
    try {
      await updateData((d) => ({ ...d, watchlist: [...d.watchlist.filter((s) => s !== sym), sym] }), `Watch ${sym}`);
      renderRankings();
      toast(`已加入 ${sym} 到觀察清單`);
      setTimeout(refresh, 60000);
    } catch (e) {
      btn.disabled = false;
      toast(`失敗：${e.detail || e.message}`);
    }
  }
  ["moversList", "popularList"].forEach((id) => $(id).addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-watch]");
    if (btn) watchFromList(btn);
  }));

  // ---------- views ----------
  function showView() {
    const v = (location.hash || "#watch").slice(1);
    const view = ["watch", "movers", "popular"].includes(v) ? v : "watch";
    ["watch", "movers", "popular"].forEach((n) => { $(`view-${n}`).hidden = n !== view; });
    document.querySelectorAll(".tabs a").forEach((a) => a.classList.toggle("on", a.dataset.view === view));
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", showView);
  showView();

  // ---------- events ----------
  $("addStock").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const sym = $("symbol").value.trim().toUpperCase().replace(/\s+/g, "");
    const msg = $("addMsg");
    msg.innerHTML = "";
    if (!/^[A-Z0-9.\-^=]{1,15}$/.test(sym)) { msg.innerHTML = `<div class="err hint">股票代號格式唔啱</div>`; return; }
    if (data.watchlist.includes(sym)) { msg.innerHTML = `<div class="warn hint">${esc(sym)} 已經喺清單入面</div>`; return; }
    $("addBtn").disabled = true;
    try {
      await updateData((d) => ({ ...d, watchlist: [...d.watchlist.filter((s) => s !== sym), sym] }), `Watch ${sym}`);
      $("symbol").value = "";
      toast(`已加入 ${sym}，大約一分鐘內會攞到價`);
      setTimeout(refresh, 45000);
      setTimeout(refresh, 90000);
    } catch (e) {
      msg.innerHTML = `<div class="err hint">儲存失敗：${esc(e.detail || e.message)}</div>`;
    } finally {
      $("addBtn").disabled = false;
    }
  });

  $("watchMode").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-wmode]");
    if (!b) return;
    watchMode = b.dataset.wmode; store.set("sa.wmode", watchMode);
    openFormFor = null;
    render(true);
  });
  $("watchPeriod").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-period]");
    if (!b) return;
    watchPeriod = b.dataset.period; store.set("sa.wperiod", watchPeriod);
    render(true);
  });

  $("list").addEventListener("input", (ev) => {
    const f = ev.target.closest("form.alert-form");
    if (!f) return;
    const q = quote(f.dataset.sym), target = parseFloat(f.price.value), box = f.querySelector(".msg");
    box.innerHTML = "";
    if (q.price == null || isNaN(target)) return;
    const up = f.condition.value === "above";
    if ((up && q.price >= target) || (!up && q.price <= target))
      box.innerHTML = `<div class="warn">而家已經係 ${fmt(q.price)}，儲存之後下次 check 會即刻觸發。</div>`;
  });

  $("list").addEventListener("submit", async (ev) => {
    const f = ev.target.closest("form.alert-form");
    if (!f) return;
    ev.preventDefault();
    const sym = f.dataset.sym, price = parseFloat(f.price.value);
    if (!(price > 0)) return;
    const alert = { id: newId(), symbol: sym, condition: f.condition.value, price, note: f.note.value.trim(), created_at: new Date().toISOString() };
    const btn = f.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      openFormFor = null;
      await updateData((d) => ({ ...d, alerts: [...d.alerts, alert] }), `Alert ${sym} ${alert.condition} ${price}`);
      toast(`已設定 ${sym} 通知`);
    } catch (e) {
      openFormFor = sym;
      btn.disabled = false;
      f.querySelector(".msg").innerHTML = `<div class="err">儲存失敗：${esc(e.detail || e.message)}</div>`;
    }
  });

  $("list").addEventListener("click", async (ev) => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === "openForm") { openFormFor = btn.dataset.sym; render(true); return; }
    if (act === "cancelForm") { openFormFor = null; render(true); return; }
    btn.disabled = true;
    try {
      if (act === "removeStock") {
        const sym = btn.dataset.sym;
        const n = data.alerts.filter((a) => a.symbol.toUpperCase() === sym).length;
        if (!window.confirm(n ? `移除 ${sym}？佢嘅 ${n} 個通知都會一齊刪除。` : `由觀察清單移除 ${sym}？`)) { btn.disabled = false; return; }
        await updateData((d) => ({
          watchlist: d.watchlist.filter((s) => s !== sym),
          alerts: d.alerts.filter((a) => a.symbol.toUpperCase() !== sym),
        }), `Unwatch ${sym}`);
        toast(`已移除 ${sym}`);
      } else if (act === "delAlert") {
        const id = btn.dataset.id;
        await updateData((d) => ({ ...d, alerts: d.alerts.filter((a) => a.id !== id) }), "Delete alert");
        toast("已刪除通知");
      } else if (act === "rearm") {
        const id = btn.dataset.id, fresh = newId();
        await updateData((d) => ({ ...d, alerts: d.alerts.map((a) => a.id === id ? { ...a, id: fresh } : a) }), "Re-arm alert");
        toast("通知已重新開啟");
      }
    } catch (e) {
      toast(`失敗：${e.detail || e.message}`);
      btn.disabled = false;
    }
  });

  // ---------- settings ----------
  function openSettings() {
    $("owner").value = cfg.owner; $("repo").value = cfg.repo; $("token").value = cfg.token;
    if (!$("settings").open) $("settings").showModal();
  }
  $("openSettings").onclick = openSettings;
  $("bannerSettings").onclick = openSettings;
  $("forget").onclick = () => { store.del("sa.token"); cfg.token = ""; $("token").value = ""; toast("已清除 token"); render(true); };
  $("settings").addEventListener("close", () => {
    if ($("settings").returnValue !== "save") return;
    cfg.owner = $("owner").value.trim(); cfg.repo = $("repo").value.trim(); cfg.token = $("token").value.trim();
    store.set("sa.owner", cfg.owner); store.set("sa.repo", cfg.repo);
    if (cfg.token) store.set("sa.token", cfg.token); else store.del("sa.token");
    refresh();
  });

  refresh();
  setInterval(refresh, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
