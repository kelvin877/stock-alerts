name: 更新排行

on:
  schedule:
    # Hourly during US market hours (UTC, Mon-Fri), plus once after the close.
    - cron: "23 13-21 * * 1-5"
    - cron: "40 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build rankings
        run: python scripts/rankings.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rankings.json universe.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update rankings [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
